name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GOOGLE_ANALYTICS_ID: G-K311DKX63B
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Restore Yarn cache
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: yarn
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn ci:verify
      - run: test -f dist/CNAME && test -f dist/.nojekyll
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

  dependabot-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2.4.0
      # Major updates are left open for manual review.
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Merges made with GITHUB_TOKEN do not trigger push workflows, so dispatch the deploy.
        run: |
          gh pr merge --squash --delete-branch "$PR_URL"
          gh workflow run deploy-pages.yml --ref main
